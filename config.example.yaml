# Seeker — Configuration
# Copy this file to config.yaml and adjust to your environment.

# Which realtime brain drives the slides.
#   openai — OpenAI Realtime API, conductor-driven (no VAD in the trigger
#            path; the fix for continuous worship audio). The default.
#   gemini — legacy Gemini Live path (server-VAD turn segmentation).
provider: "openai"

audio:
  device_name: "default"        # Substring match against available input devices
  device_index: null             # Override: set an explicit device index
  sample_rate: 16000             # Capture rate; resampled to 24 kHz for OpenAI
  channels: 1
  chunk_duration_ms: 32
  queue_max_size: 100
  input_gain_db: 0.0

openai:
  api_key: "${OPENAI_API_KEY}"   # Set via environment variable
  # gpt-realtime-2.1 (2026-07-06) is the flagship; gpt-realtime-2.1-mini is
  # ~5x cheaper on audio-in and a good fit once tracking accuracy is proven.
  # When gpt-live's API ships, point this at it and set turn_mode: full_duplex.
  model: "gpt-realtime-2.1"
  # Streaming input transcription — feeds the deterministic lyric tracker and
  # lets the server swap audio tokens for text in context (cheaper long runs).
  transcribe_model: "gpt-realtime-whisper"
  transcribe_language: "en"
  transcribe_delay: "low"        # minimal|low|medium|high (whisper model only)
  # conductor    — Seeker owns the decision clock (today's mode)
  # server_vad   — API VAD segments turns (A/B baseline; fails on music)
  # full_duplex  — anticipated gpt-live mode: the model acts on its own
  turn_mode: "conductor"
  noise_reduction: "far_field"   # near_field|far_field|"" — board feeds: far_field
  reasoning_effort: "low"        # decisions must be fast, not deep
  tick_min_interval_s: 0.9       # fastest allowed decision cadence
  tick_max_interval_s: 2.5       # slowest allowed decision cadence (with new audio)
  commit_interval_s: 0.8         # how often buffered audio becomes context
  min_commit_ms: 160             # never commit slivers (API rejects <100 ms)
  max_response_tokens: 64        # a decision is a tool call or "HOLD"
  reconnect_max_backoff_s: 8.0
  truncation_retention_ratio: 0.8      # cache-friendly server-side truncation
  post_instructions_token_limit: 8000  # context budget beyond the instructions
  session_rotate_s: 3000         # rotate ahead of the hard 60-min session cap
  tracker_autofire: true         # song mode: fire unambiguous verbatim lyric matches
  tracker_autofire_confidence: 0.9

gemini:
  api_key: "${GEMINI_API_KEY}"   # Set via environment variable
  # Stable alias for the 2.5 native-audio Live model (the dated 09-2025 preview
  # was removed 2026-03-19). Verify against the current Gemini model list.
  model: "models/gemini-live-2.5-flash-native-audio"
  target_tokens: 100000
  reconnect_max_backoff_s: 8.0

propresenter:
  host: "127.0.0.1"
  port: 50001
  protocol: "http"
  timeout_s: 2.0
  use_sequential_trigger: true
  health_check_interval_s: 30
  ws_password: ""
  sermon_uuid: ""                # UUID of the sermon presentation for auto-activation
  # Closed-loop / safety controls
  preflight_trigger_test: false  # if true, the pre-flight check moves real slides on the live deck
  drift_poll_interval_s: 2.0     # how often to read the actual on-screen slide for drift/override detection
  auto_yield_cooldown_s: 5.0     # after a human moves a slide, pause automatic advance for this long
  max_slide_jump: 0              # cap how far the agent may jump per trigger (0 = unlimited; sequential sermons only)

operator:
  http_port: 8080
  http_host: "127.0.0.1"

logging:
  level: "INFO"
  file: "seeker.log"
  console: true
  latency_tracking: true

prompt:
  template: "prompts/v1.0_baseline.txt"
  song_template: "prompts/v1.1_worship.txt"  # Prompt template for song/worship mode
  manuscript: ""                 # Path to manuscript file; set at runtime via CLI
  mode: "sermon"                # "sermon" or "song"
  anticipation_seconds: 1.0     # Predictive lead time for song mode (seconds)
  arrangement_pdf: ""           # Optional .txt or .pdf song arrangement (PDF requires the `pdf` extra)
